
details:
  author: Dashwise
  categories:
    - Launcher
    - Automation
  description: Control Dashwise Launcher functions like app launching, media
    control, brightness, and DND.
  icon: /icons/png/dashwise.png
  name: Dashwise Launcher
  version: 1.0.0
configuration:
  endpoints:
    fetch-shortcuts:
      auth: Bearer ${API_KEY}
      method: GET
      response:
        data_path: shortcuts
      response_mapping:
        shortcuts_list:
          iterate: shortcuts
          mappingProperties:
            id: id
            name: name
            type: type
      url: ${URL}/api/shortcuts
  environment_variables:
    API_KEY:
      description: Bearer token for authenticating with the Launcher API
      edit: overwrite-only
      required: true
      user_hidden: false
    URL:
      default: http://localhost:47821
      description: Base URL of the Dashwise Launcher API
      required: false
  shortcuts:
    - main:
        iterate_over: this.endpoints.fetch-shortcuts.mappedResponse.shortcuts
        mappingProperties:
          action: 
            type: post
            url: ${URL}/api/shortcuts/run?id=${id}
            auth: Bearer ${API_KEY}
          icon: integrations.dashwise-launcher.details.icon
          id: ${id}
          name: ${name}
          secondaryInfo: ${type}
          tags:
            - Launcher
            - ${type}
            - ${name}
          type: launcherShortcut